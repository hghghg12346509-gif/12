<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра «Огонь»: 10 Скримеров</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #1a0000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            cursor: crosshair;
        }

        #game-area {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* --- ОГНЕННЫЙ КРУГ --- */
        #circle {
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: rgba(255, 69, 0, 0.15);
            border: 4px solid #ff4500;
            border-radius: 50%;
            box-shadow: 0 0 30px #ff0000, inset 0 0 20px #ff4500;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: width 0.1s linear, height 0.1s linear;
            animation: firePulse 1.5s infinite alternate;
        }

        @keyframes firePulse {
            0% { box-shadow: 0 0 20px #ff0000, inset 0 0 10px #ff4500; }
            100% { box-shadow: 0 0 50px #ff4500, inset 0 0 30px #ff0000; }
        }

        .trajectory-line {
            position: absolute;
            height: 6px;
            background-color: #ffaa00;
            box-shadow: 0 0 20px #ff4500;
            border-radius: 3px;
            transform-origin: 0 50%;
            pointer-events: none;
            z-index: 15;
            opacity: 0.9;
            animation: flash 0.3s infinite alternate;
        }

        @keyframes flash { from { opacity: 0.3; } to { opacity: 1; } }

        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffaa00;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 15px #ff0000;
            z-index: 5;
        }

        /* --- ЭКРАНЫ --- */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 0, 0, 0.95);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; text-align: center; z-index: 10;
        }

        .overlay h1 { font-size: 54px; margin-bottom: 10px; color: #ff4500; text-shadow: 0 0 30px #ff0000; }
        .overlay p { font-size: 20px; margin-bottom: 30px; max-width: 600px; line-height: 1.5; color: #ffccaa; }
        
        .overlay button {
            padding: 15px 40px; font-size: 24px; font-weight: bold;
            color: #fff; background: linear-gradient(45deg, #ff0000, #ff4500);
            border: none; border-radius: 30px; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 0 20px #ff4500;
        }
        .overlay button:hover { transform: scale(1.1); box-shadow: 0 0 40px #ff0000; }

        #countdown {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 180px; font-weight: bold; color: #ff4500;
            text-shadow: 0 0 40px #ff0000; z-index: 20; pointer-events: none;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* --- ЭКРАН СКРИМЕРА --- */
        #screamer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; z-index: 9999; display: flex;
            justify-content: center; align-items: center;
            overflow: hidden;
        }

        #screamer-content {
            font-size: 70vh; /* Огромный размер */
            user-select: none;
        }

        /* Анимации для скримеров */
        .anim-shake {
            animation: shake 0.05s infinite;
            filter: contrast(200%) brightness(150%) drop-shadow(0 0 50px red);
        }
        @keyframes shake {
            0% { transform: translate(10px, 10px) scale(1.1) rotate(2deg); }
            25% { transform: translate(-15px, -15px) scale(1.2) rotate(-3deg); }
            50% { transform: translate(-10px, 15px) scale(1.15) rotate(1deg); }
            75% { transform: translate(15px, -10px) scale(1.3) rotate(-2deg); }
            100% { transform: translate(10px, 10px) scale(1.1) rotate(2deg); }
        }

        .anim-glitch {
            animation: glitch 0.1s infinite;
            filter: invert(1) hue-rotate(90deg) contrast(300%);
        }
        @keyframes glitch {
            0% { transform: translate(0) skew(0); }
            20% { transform: translate(-10px, 5px) skew(10deg); }
            40% { transform: translate(10px, -5px) skew(-10deg); }
            60% { transform: translate(-5px, -10px) skew(5deg); }
            80% { transform: translate(5px, 10px) skew(-5deg); }
            100% { transform: translate(0) skew(0); }
        }

        .anim-zoom {
            animation: zoomIn 0.5s cubic-bezier(0.1, 0.9, 0.2, 1) infinite alternate;
            filter: sepia(100%) hue-rotate(-50deg) saturate(500%) contrast(200%);
        }
        @keyframes zoomIn {
            0% { transform: scale(0.8); }
            100% { transform: scale(2.5); }
        }

        .anim-invert {
            animation: invertFlash 0.15s infinite;
        }
        @keyframes invertFlash {
            0%, 100% { filter: invert(0); background: #000; }
            50% { filter: invert(1); background: #fff; }
        }

        /* --- КРОВАВЫЙ ЭКРАН --- */
        #red-flash {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(255,0,0,0.8) 0%, rgba(100,0,0,1) 100%);
            opacity: 0; pointer-events: none; z-index: 100; transition: opacity 0.1s ease;
        }

        /* --- ТАБЛИЦА РЕКОРДОВ (сдвинута вправо, чтобы не перекрывать игру) --- */
        #records-panel {
            position: absolute;
            top: 20px;
            right: 20px;          /* сдвиг от края, чтобы не перекрывать игру */
            width: 260px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: rgba(20, 0, 0, 0.85);
            border: 2px solid #ff4500;
            border-radius: 15px;
            box-shadow: 0 0 20px #ff0000, inset 0 0 15px rgba(255, 69, 0, 0.3);
            padding: 15px;
            color: #ffccaa;
            z-index: 5;
            pointer-events: none; /* панель не мешает управлять курсором в игре */
        }

        #records-panel h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #ff4500;
            text-align: center;
            text-shadow: 0 0 15px #ff0000;
        }

        #records-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
        }

        #records-table th {
            color: #ffaa00;
            text-shadow: 0 0 10px #ff0000;
            border-bottom: 2px solid #ff4500;
            padding: 6px 4px;
            text-align: left;
        }

        #records-table td {
            padding: 5px 4px;
            border-bottom: 1px solid rgba(255, 69, 0, 0.3);
        }

        #records-table tr.record-new td {
            color: #fff;
            background: rgba(255, 69, 0, 0.25);
            text-shadow: 0 0 10px #ff0000;
            font-weight: bold;
        }

        /* --- ФОРМА ВВОДА ИМЕНИ ПОСЛЕ ПРОИГРЫША --- */
        #name-form {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        #name-input {
            padding: 10px 15px;
            font-size: 18px;
            border: 2px solid #ff4500;
            border-radius: 10px;
            background: #1a0000;
            color: #ffccaa;
            outline: none;
        }
        #save-name-btn {
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff0000, #ff4500);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff4500;
        }
        #save-name-btn:hover { box-shadow: 0 0 30px #ff0000; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-area">
        <div id="score-display">Время: 0.0с</div>
        <div id="countdown" class="hidden">3</div>
        <div id="circle" class="hidden"></div>

        <!-- ТАБЛИЦА РЕКОРДОВ -->
        <div id="records-panel">
            <h2>🔥 Рекорды 🔥</h2>
            <table id="records-table">
                <thead>
                    <tr><th>#</th><th>Имя</th><th>Время</th></tr>
                </thead>
                <tbody id="records-body">
                    <tr><td colspan="3" style="text-align:center; color:#ff8866;">Пока пусто…</td></tr>
                </tbody>
            </table>
        </div>

        <div id="start-screen" class="overlay">
            <h1>🔥 Игра «Огонь» 🔥</h1>
            <p>Удерживайте курсор внутри круга.<br>Круг будет медленно сужаться и ускоряться!<br><br>
            <span style="color:red; font-weight:bold; font-size: 24px;">ВНИМАНИЕ: 10 РАЗНЫХ СКРИМЕРОВ, ГРОМКИЙ ЗВУК И ВСПЫШКИ!</span></p>
            <button id="start-btn">Я готов(а) к страху</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h1 style="color: #ff0000; text-shadow: 0 0 30px #ff0000;">Вы сгорели!</h1>
            <p>Вы продержались в огне: <span id="final-score">0.0</span> секунд</p>
            <div id="name-form">
                <input type="text" id="name-input" placeholder="Ваше имя" maxlength="15">
                <button id="save-name-btn">Сохранить рекорд</button>
            </div>
            <br>
            <button id="restart-btn">Попробовать снова</button>
        </div>
    </div>

    <div id="red-flash"></div>

    <!-- СКРИМЕР -->
    <div id="screamer" class="hidden">
        <div id="screamer-content"></div>
    </div>

    <script>
        const circle = document.getElementById('circle');
        const scoreDisplay = document.getElementById('score-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const countdownEl = document.getElementById('countdown');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreSpan = document.getElementById('final-score');
        const gameArea = document.getElementById('game-area');
        const redFlash = document.getElementById('red-flash');
        const screamer = document.getElementById('screamer');
        const screamerContent = document.getElementById('screamer-content');
        const recordsBody = document.getElementById('records-body');
        const nameInput = document.getElementById('name-input');
        const saveNameBtn = document.getElementById('save-name-btn');

        let isPlaying = false;
        let isPreview = false;
        let previewTimer = null;
        
        let mouseX = window.innerWidth / 2; 
        let mouseY = window.innerHeight / 2;
        
        let circleX = 0, circleY = 0;
        let radius = 100;
        let speedX = 5;
        let speedY = 5;
        
        let startTime = 0;
        let currentScore = 0;
        let animationFrameId;

        // --- ТАБЛИЦА РЕКОРДОВ ---
        const RECORDS_KEY = 'fireGameRecords';
        const MAX_RECORDS = 5;

        function loadRecords() {
            try {
                return JSON.parse(localStorage.getItem(RECORDS_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function saveRecords(records) {
            try {
                localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
            } catch (e) {}
        }

        function renderRecords(highlightIndex = -1) {
            const records = loadRecords();
            if (records.length === 0) {
                recordsBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#ff8866;">Пока пусто…</td></tr>';
                return;
            }
            recordsBody.innerHTML = records.map((r, i) =>
                `<tr${i === highlightIndex ? ' class="record-new"' : ''}>` +
                `<td>${i + 1}</td><td>${r.name}</td><td>${r.score.toFixed(1)}с</td></tr>`
            ).join('');
        }

        function addRecord(name, score) {
            const safeName = (name.trim() || 'Без имени')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const records = loadRecords();
            records.push({ name: safeName, score: score });
            records.sort((a, b) => b.score - a.score);
            const trimmed = records.slice(0, MAX_RECORDS);
            saveRecords(trimmed);
            const idx = trimmed.findIndex(r => r.name === safeName && r.score === score);
            renderRecords(idx);
        }

        renderRecords();

        // --- 10 РАЗНЫХ СКРИМЕРОВ ---
        const screamers = [
            { emoji: '💀', anim: 'anim-shake', sound: 'scream' }, // Череп
            { emoji: '👹', anim: 'anim-zoom', sound: 'growl' },   // Демон
            { emoji: '👻', anim: 'anim-glitch', sound: 'screech' },// Призрак
            { emoji: '👽', anim: 'anim-invert', sound: 'static' }, // Пришелец
            { emoji: '🧟', anim: 'anim-zoom', sound: 'growl' },   // Зомби
            { emoji: '🤡', anim: 'anim-shake', sound: 'screech' }, // Клоун
            { emoji: '👁️', anim: 'anim-glitch', sound: 'scream' }, // Глаз
            { emoji: '🕷️', anim: 'anim-invert', sound: 'static' }, // Паук
            { emoji: '😈', anim: 'anim-shake', sound: 'growl' },  // Дьявол
            { emoji: '☠️', anim: 'anim-zoom', sound: 'scream' }   // Кости
        ];

        // --- ГЕНЕРАТОР ЗВУКОВ ---
        function playScarySound(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                gainNode.connect(audioCtx.destination);

                if (type === 'scream') {
                    // Высокий искаженный крик
                    const osc = audioCtx.createOscillator();
                    const dist = audioCtx.createWaveShaper();
                    const curve = new Float32Array(44100).map((_, i) => Math.sin(i * 0.01) * 100);
                    dist.curve = curve;
                    
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 1);
                    osc.connect(dist);
                    dist.connect(gainNode);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.5);
                } 
                else if (type === 'growl') {
                    // Низкий рык
                    const osc = audioCtx.createOscillator();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 1);
                    osc.connect(gainNode);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.5);
                }
                else if (type === 'screech') {
                    // Скрежет
                    const osc = audioCtx.createOscillator();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(2000, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(2500, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(1800, audioCtx.currentTime + 0.2);
                    osc.frequency.setValueAtTime(3000, audioCtx.currentTime + 0.3);
                    osc.connect(gainNode);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.5);
                }
                else if (type === 'static') {
                    // Белый шум
                    const bufferSize = audioCtx.sampleRate * 1.5;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    noise.connect(gainNode);
                    noise.start();
                }
            } catch (e) {
                console.log("Звук заблокирован браузером");
            }
        }

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function prepareGame() {
            isPlaying = false;
            isPreview = false;
            clearTimeout(previewTimer);
            cancelAnimationFrame(animationFrameId);
            
            redFlash.style.opacity = '0';
            screamer.classList.add('hidden');
            screamerContent.className = ''; // Сброс анимаций

            const oldLine = document.querySelector('.trajectory-line');
            if (oldLine) oldLine.remove();

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            circle.classList.add('hidden');
            scoreDisplay.textContent = 'Время: 0.0с';
            
            countdownEl.classList.remove('hidden');
            let count = 3;
            countdownEl.textContent = count;
            
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.textContent = count;
                } else {
                    clearInterval(timer);
                    countdownEl.classList.add('hidden');
                    startActualGame();
                }
            }, 1000);
        }

        function startActualGame() {
            isPlaying = true;
            isPreview = true; 
            radius = 100;
            currentScore = 0;
            
            const randomAngle = Math.random() * Math.PI * 2;
            const startSpeed = 6;
            speedX = Math.cos(randomAngle) * startSpeed;
            speedY = Math.sin(randomAngle) * startSpeed;

            circleX = mouseX;
            circleY = mouseY;

            if (circleX - radius < 0) circleX = radius;
            if (circleX + radius > window.innerWidth) circleX = window.innerWidth - radius;
            if (circleY - radius < 0) circleY = radius;
            if (circleY + radius > window.innerHeight) circleY = window.innerHeight - radius;

            circle.style.width = (radius * 2) + 'px';
            circle.style.height = (radius * 2) + 'px';
            circle.style.left = circleX + 'px';
            circle.style.top = circleY + 'px';
            circle.classList.remove('hidden');

            const line = document.createElement('div');
            line.classList.add('trajectory-line');
            line.style.left = circleX + 'px';
            line.style.top = (circleY - 3) + 'px';
            line.style.width = (radius - 10) + 'px';
            line.style.transform = `rotate(${randomAngle}rad)`;
            gameArea.appendChild(line);

            previewTimer = setTimeout(() => {
                isPreview = false;
                line.remove();
                startTime = Date.now(); 
                updateGame();
            }, 1500); 
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);
            circle.classList.add('hidden');
            
            // 1. Кровавая вспышка
            redFlash.style.opacity = '0.8';
            
            // 2. Выбор случайного скримера
            setTimeout(() => {
                const randomScreamer = screamers[Math.floor(Math.random() * screamers.length)];
                
                screamerContent.textContent = randomScreamer.emoji;
                screamerContent.className = randomScreamer.anim;
                screamer.classList.remove('hidden');
                
                playScarySound(randomScreamer.sound);
                
                // 3. Экран проигрыша
                setTimeout(() => {
                    screamer.classList.add('hidden');
                    screamerContent.className = '';
                    redFlash.style.opacity = '0';
                    gameOverScreen.classList.remove('hidden');
                    finalScoreSpan.textContent = currentScore.toFixed(1);
                }, 1500); // Скример висит 1.5 секунды
                
            }, 200); // Небольшая задержка перед скримером
        }

        function updateGame() {
            if (!isPlaying) return;

            if (!isPreview) {
                circleX += speedX;
                circleY += speedY;

                if (circleX - radius <= 0 || circleX + radius >= window.innerWidth) speedX *= -1;
                if (circleY - radius <= 0 || circleY + radius >= window.innerHeight) speedY *= -1;

                const dist = Math.sqrt(Math.pow(mouseX - circleX, 2) + Math.pow(mouseY - circleY, 2));
                if (dist > radius) {
                    gameOver();
                    return;
                }

                currentScore = (Date.now() - startTime) / 1000;
                scoreDisplay.textContent = `Время: ${currentScore.toFixed(1)}с`;

                if (radius > 30) {
                    radius -= 0.03; 
                    circle.style.width = (radius * 2) + 'px';
                    circle.style.height = (radius * 2) + 'px';
                }

                if (Math.floor(currentScore) > 0 && Math.floor(currentScore) % 5 === 0 && Math.floor(currentScore) > (circle.lastSpeedUpdate || 0)) {
                    circle.lastSpeedUpdate = Math.floor(currentScore);
                    if (Math.abs(speedX) < 25) {
                        speedX *= 1.12;
                        speedY *= 1.12;
                    }
                }
            }

            circle.style.left = circleX + 'px';
            circle.style.top = circleY + 'px';

            animationFrameId = requestAnimationFrame(updateGame);
        }

        startBtn.addEventListener('click', prepareGame);
        restartBtn.addEventListener('click', prepareGame);

        // Сохранение рекорда после проигрыша
        saveNameBtn.addEventListener('click', () => {
            addRecord(nameInput.value, currentScore);
            nameInput.value = '';
            saveNameBtn.textContent = 'Сохранено!';
            setTimeout(() => { saveNameBtn.textContent = 'Сохранить рекорд'; }, 1500);
        });
        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveNameBtn.click();
        });
    </script>
</body>
</html>
